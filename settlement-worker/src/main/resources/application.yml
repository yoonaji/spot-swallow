server:
  port: 8081

spring:
  application:
    name: settlement-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swallow}
    username: ${DB_USER:swallow}
    password: ${DB_PASSWORD:swallow}
    hikari:
      maximum-pool-size: 3
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:swallow}
    password: ${RABBIT_PASSWORD:swallow}
    listener:
      simple:
        # 한 워커는 한 번에 한 작업만 가져간다. 회수 시 재처리되는 작업이 최대 1건이 된다.
        prefetch: 1
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false

swallow:
  worker:
    id: ${WORKER_ID:${HOSTNAME:worker-local}}
    # 거래 1건당 추가 처리 시간(마이크로초). 처리율 μ 를 실험에 맞게 조절한다.
    work-micros-per-tx: ${WORK_MICROS_PER_TX:0}
    # 0 보다 크면 거래 N 건마다 중간 합계를 저장하고, 회수 뒤 다시 받은 작업은 저장 지점부터 계산한다.
    checkpoint-every-tx: ${CHECKPOINT_EVERY_TX:0}
  queue:
    max-priority: ${QUEUE_MAX_PRIORITY:10}
  notice:
    # 회수 경고를 읽는 곳: none | file | imds (SpotNoticeWatcher)
    source: ${SPOT_NOTICE_SOURCE:none}
    file: ${SPOT_NOTICE_FILE:/tmp/spot-notice}
    poll-ms: 1000
    # 처리 중인 작업을 끝내기까지 기다리는 최대 시간. 경고 후 2분 안에 끝나야 하므로 110초.
    drain-timeout-ms: 110000
  chaos:
    # NONE | BEFORE_COMMIT | AFTER_COMMIT_BEFORE_ACK
    crash-point: ${CHAOS_CRASH_POINT:NONE}
    crash-probability: ${CHAOS_CRASH_PROBABILITY:0}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
      worker: ${swallow.worker.id}
