global:
  scrape_interval: 5s

scrape_configs:
  - job_name: settlement-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["settlement-api:8080"]

  # 워커는 개수가 바뀌므로 Docker 내장 DNS 로 모든 복제본을 찾는다.
  - job_name: settlement-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: ["settlement-worker"]
        type: A
        port: 8081

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
