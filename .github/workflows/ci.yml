name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: 제어 알고리즘 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tests

  java:
    name: 정산 API·워커 빌드와 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q verify

  e2e:
    name: 장애 주입 대사 검증 (커밋 후 Ack 전 30% 종료)
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q package -DskipTests
      - name: 시스템 기동
        env:
          CHAOS_CRASH_POINT: AFTER_COMMIT_BEFORE_ACK
          CHAOS_CRASH_PROBABILITY: "0.3"
        run: docker compose up -d --build --scale settlement-worker=3 postgres rabbitmq settlement-api settlement-worker
      - name: 작업 100건 처리 후 유실·중복·금액 불일치 0 확인
        run: python3 scripts/e2e.py --merchants 50 --days 2 --resubmit --timeout 400 | tee e2e.log && grep -q "RESULT: PASS" e2e.log
      - if: failure()
        run: docker compose logs --tail 200
