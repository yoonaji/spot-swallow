server:
  port: 8080

spring:
  application:
    name: settlement-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/swallow}
    username: ${DB_USER:swallow}
    password: ${DB_PASSWORD:swallow}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:swallow}
    password: ${RABBIT_PASSWORD:swallow}
    publisher-confirm-type: correlated

swallow:
  queue:
    # 0 보다 크면 우선순위 큐. 급한 작업(URGENT)을 먼저 꺼낸다. 워커와 같은 값이어야 한다. 0 이면 접수 순서(FIFO).
    max-priority: ${QUEUE_MAX_PRIORITY:10}
  deadline:
    # 마감 등급별 목표 시간(초). 접수 시각 + 이 값이 deadline_at 이 된다.
    urgent-seconds: ${DEADLINE_URGENT_SECONDS:120}
    normal-seconds: ${DEADLINE_NORMAL_SECONDS:300}
  outbox:
    poll-ms: 200
    batch-size: 50
  chaos:
    # 0 보다 크면 그 확률로 "브로커 수신 후, PUBLISHED 표시 전" 에 프로세스를 강제 종료한다.
    publisher-crash-after-send-probability: ${CHAOS_PUBLISHER_CRASH_PROBABILITY:0}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
